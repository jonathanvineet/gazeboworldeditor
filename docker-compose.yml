version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gazebo-studio-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL (for future use)
  postgres:
    image: postgres:15-alpine
    container_name: gazebo-studio-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gazebo_studio
      POSTGRES_USER: gazebo
      POSTGRES_PASSWORD: gazebo_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis (for future use - caching, sessions)
  redis:
    image: redis:7-alpine
    container_name: gazebo-studio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
